<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FX Signal Engine{% endblock %}</title>
<style>
  :root {
    --bg:#f7f7f8; --fg:#1a1a1a; --card:#ffffff; --border:#e2e2e5;
    --accent:#2563eb; --green:#16a34a; --red:#dc2626; --amber:#d97706; --muted:#6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --fg:#e5e7eb; --card:#181b22; --border:#2a2e37;
             --accent:#60a5fa; --green:#4ade80; --red:#f87171; --amber:#fbbf24; --muted:#9aa1ad; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  nav { display:flex; gap:4px; padding:12px 20px; border-bottom:1px solid var(--border); background:var(--card); flex-wrap:wrap; }
  nav a { color:var(--fg); text-decoration:none; padding:8px 12px; border-radius:6px; font-size:14px; }
  nav a:hover, nav a.active { background:var(--border); }
  main { padding:20px; max-width:1100px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 20px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; }
  .buy { color:var(--green); font-weight:600; }
  .sell { color:var(--red); font-weight:600; }
  .ok { color:var(--green); }
  .warn { color:var(--amber); }
  .error { color:var(--red); }
  .muted { color:var(--muted); }
  .stat-row { display:flex; gap:16px; flex-wrap:wrap; }
  .stat { flex:1; min-width:140px; }
  .stat .value { font-size:24px; font-weight:700; }
  .stat .label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:14px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  p.lede { color:var(--muted); font-size:13px; margin-top:0; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge-consistent { background:#16a34a22; color:var(--green); }
  .badge-rejected { background:#dc262622; color:var(--red); }
  .badge-overfit_or_degraded, .badge-weak_out_of_sample { background:#d9770622; color:var(--amber); }
  .badge-inconclusive, .badge-none { background:#6b728022; color:var(--muted); }
  .overflow { overflow-x:auto; }
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('overview') }}">Overview</a>
  <a href="{{ url_for('signals_page') }}">Signals</a>
  <a href="{{ url_for('strategies_page') }}">Strategies</a>
  <a href="{{ url_for('paper_trades_page') }}">Paper Trades</a>
  <a href="{{ url_for('health_page') }}">System Health</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
